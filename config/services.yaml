services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Interface aliases
    App\Contract\Bus\CommandBusInterface: '@App\Infrastructure\Bus\SimpleCommandBus'
    App\Contract\Bus\QueryBusInterface: '@App\Infrastructure\Bus\SimpleQueryBus'
    Psr\Cache\CacheItemPoolInterface: '@App\Infrastructure\Cache\FileCacheAdapter'
    Psr\SimpleCache\CacheInterface: '@App\Infrastructure\Cache\SimpleFileCacheAdapter'

    # Infrastructure
    App\Contract\Bus\Locator\HandlerLocatorInterface: '@App\Infrastructure\Bus\Locator\ConventionBasedHandlerLocator'

    App\Infrastructure\Bus\Locator\ConventionBasedHandlerLocator:
        arguments:
            $container: '@service_container'

    App\Infrastructure\Bus\Middleware\CommandCacheInvalidationMiddleware:
        # Using PSR-16 simple cache adapter.
        arguments: ['@App\Infrastructure\Cache\SimpleFileCacheAdapter']

    App\Infrastructure\Bus\SimpleCommandBus:
        arguments:
            $locator: '@App\Contract\Bus\Locator\HandlerLocatorInterface'
            $middlewares:
                - '@App\Infrastructure\Bus\Middleware\CommandCacheInvalidationMiddleware'

    App\Infrastructure\Bus\Middleware\QueryCacheMiddleware:
        # Using PSR-16 simple cache adapter.
        arguments: ['@App\Infrastructure\Cache\SimpleFileCacheAdapter']

    App\Infrastructure\Bus\SimpleQueryBus:
        arguments:
            $locator: '@App\Contract\Bus\Locator\HandlerLocatorInterface'
            $middlewares:
                - '@App\Infrastructure\Bus\Middleware\QueryCacheMiddleware'

    # Make handlers public so the simple bus can locate them via container
    App\Application\SolanaContract\CommandHandler\:
        resource: '../src/Application/SolanaContract/CommandHandler/'
        public: true

    App\Application\SolanaContract\QueryHandler\:
        resource: '../src/Application/SolanaContract/QueryHandler/'
        public: true

    App\Application\User\QueryHandler\:
        resource: '../src/Application/User/QueryHandler/'
        public: true
